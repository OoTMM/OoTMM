packages:
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  bufferutil: true
  es5-ext: true
  esbuild: true
  microtime: true
  netlify-cli: true
  nx: true
  sharp: true
  unix-dgram: true
  utf-8-validate: true
  yaz0: true

catalog:
  '@preact/preset-vite': ^2.10.6
  '@tailwindcss/vite': ^4.3.3
  '@types/lodash-es': ^4.17.12
  fast-xml-parser: ^5.11.1
  lodash-es: ^4.18.1
  preact: ^10.29.8
  react-icons: ^5.7.0
  tailwindcss: ^4.3.3
  type-fest: ^5.9.0
  yaml: ^2.9.1

onlyBuiltDependencies:
  - '@parcel/watcher'
  - bufferutil
  - es5-ext
  - esbuild
  - microtime
  - netlify-cli
  - nx
  - sharp
  - unix-dgram
  - utf-8-validate
  - yaz0
