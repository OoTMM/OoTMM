# Reusable enemy groups and placement conditions. A name references another macro.
# Lists mean any member; all/any/not combine groups. Enemy selectors use game,
# actor, optional params/name/habitat. Decimal IDs match the enemy logic YAML.
# The oot-native/mm-native aliases identify native roster forms; classification
# groups also supply the placement solver's compatibility data during the build.

