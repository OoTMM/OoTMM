# Enemy placement policies, including physical actor slots and scripted spawns.
# Rooms use game/scene/room/setup/slots; mq selects the OoT dungeon layout.
# Split a slot out of a shared entry when it needs different allow/deny rules.
# spawns selects named scripted/ordinary sources. When both exist, both must match.
# allow and deny accept enemy macros, lists of macros, or all/any/not predicates.
# Every matching rule applies; deny wins even for plando and Remove Spawn Restrictions.
# preserve: true keeps a point vanilla; preserveUnless names the setting that unlocks it.
# The shipped oot-relaxed-native-pool explicitly opts native pools into that setting.
# Sparse native flags, variant/position overrides and runtime guards stay beside their point.

