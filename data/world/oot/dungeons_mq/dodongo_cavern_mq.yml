"Dodongo Cavern Main Room Inside Skull":
  dungeon: DC
  exits:
    "Dodongo Cavern Main Room Lower": "event(DC_MQ_OPEN_SKULL)"
    "Dodongo Cavern Pre-Boss Lobby": "true"

