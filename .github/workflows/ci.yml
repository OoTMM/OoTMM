name: Continuous Integration Workflow

on: [push, pull_request, workflow_dispatch]

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      deploy_type: ${{ steps.d.outputs.deploy_type }}
      version: ${{ steps.d.outputs.version }}
      version_suffix: ${{ steps.d.outputs.version_suffix }}
      env_keys: ${{ steps.d.outputs.env_keys }}
    steps:
      - id: d
        name: Extract Metadata
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != 'push' ]]; then
            echo "deploy_type=none" >> $GITHUB_OUTPUT
          elif [[ "${{ github.repository }}" != "OoTMM/OoTMM" ]]; then
            echo "deploy_type=none" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "deploy_type=stable" >> $GITHUB_OUTPUT
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "env_keys=${{ github.ref_name }},stable" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/master ]]; then
            echo "deploy_type=dev" >> $GITHUB_OUTPUT
            short_sha=$(echo ${{ github.sha }} | cut -c1-7)
            echo "version=dev" >> $GITHUB_OUTPUT
            echo "version_suffix=${short_sha}" >> $GITHUB_OUTPUT
            echo "env_keys=dev" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/preview/* ]]; then
            echo "deploy_type=preview" >> $GITHUB_OUTPUT
            short_sha=$(echo ${{ github.sha }} | cut -c1-7)
            branch_name=$(echo "${{ github.ref_name }}" | sed 's/preview\///' | sed 's/[^a-zA-Z0-9-]/-/g')
            echo "version=preview-${branch_name}" >> $GITHUB_OUTPUT
            echo "version_suffix=${short_sha}" >> $GITHUB_OUTPUT
            echo "env_keys=preview-${branch_name},preview" >> $GITHUB_OUTPUT
          else
            echo "deploy_type=none" >> $GITHUB_OUTPUT
          fi

  test:
    runs-on: ubuntu-latest
    container: ghcr.io/ootmm/toolchain:1.4
    needs: [meta]
    steps:
      - uses: actions/checkout@v7
#      - uses: ./.github/actions/setup
#      - name: Run Tests
#        run: pnpm test

  build:
    runs-on: ubuntu-latest
    container: ghcr.io/ootmm/toolchain:1.4
    needs: [meta]
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      VERSION_SUFFIX: ${{ needs.meta.outputs.version_suffix }}
      ENV_KEYS: ${{ needs.meta.outputs.env_keys }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Run Build
        run: pnpm nx run-many -t build --prod

      - name: Upload Web
        if: ${{ needs.meta.outputs.deploy_type == 'dev' }}
        uses: actions/upload-artifact@v7
        with:
          name: build-web
          path: packages/web/dist

      - name: Upload Web Components
        if: ${{ needs.meta.outputs.deploy_type != 'none' }}
        uses: actions/upload-artifact@v7
        with:
          name: build-web-components
          path: packages/web-components/dist

      - name: Upload Desktop
        if: ${{ needs.meta.outputs.deploy_type == 'stable' }}
        uses: actions/upload-artifact@v7
        with:
          name: build-desktop
          path: packages/desktop/dist

  deploy-web:
    needs: [meta, test, build]
    if: ${{ needs.meta.outputs.deploy_type == 'dev' }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Install Netlify CLI
        run: npm install -g netlify-cli@24
      - name: Download Web Build
        if: ${{ needs.meta.outputs.deploy_type == 'dev' }}
        uses: actions/download-artifact@v7
        with:
          name: build-web
          path: packages/web/dist

      - id: check
        name: Check if we are deploying the latest commit
        shell: bash
        run: |
          git fetch origin ${{ github.ref }}
          latest_commit=$(git rev-parse FETCH_HEAD)
          if [[ "${{ github.sha }}" != "${latest_commit}" ]]; then
            echo "This is not the latest commit. Skipping deployment."
            echo "deploy=false" >> $GITHUB_OUTPUT
          else
            echo "deploy=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Web to Netlify
        if: ${{ steps.check.outputs.deploy == 'true' }}
        run: netlify deploy -d "$PWD/dist" --no-build --site $NETLIFY_SITE_ID --prod
        working-directory: packages/web
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_WEB }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

  legacy:
    needs: [test, build]
    runs-on: ubuntu-latest
    container: ghcr.io/ootmm/toolchain:1.4
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Determine Deployment Type
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "DEPLOY_TYPE=stable" >> $GITHUB_ENV
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
            echo "ENV_KEYS=${{ github.ref_name }},stable" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == refs/heads/master ]]; then
            echo "DEPLOY_TYPE=dev" >> $GITHUB_ENV
            short_sha=$(echo ${{ github.sha }} | cut -c1-7)
            echo "VERSION=dev" >> $GITHUB_ENV
            echo "VERSION_SUFFIX=${short_sha}" >> $GITHUB_ENV
            echo "ENV_KEYS=dev" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == refs/heads/preview/* ]]; then
            echo "DEPLOY_TYPE=preview" >> $GITHUB_ENV
            short_sha=$(echo ${{ github.sha }} | cut -c1-7)
            branch_name=$(echo "${{ github.ref_name }}" | sed 's/preview\///' | sed 's/[^a-zA-Z0-9-]/-/g')
            echo "VERSION=preview-${branch_name}" >> $GITHUB_ENV
            echo "VERSION_SUFFIX=${short_sha}" >> $GITHUB_ENV
            echo "ENV_KEYS=preview-${branch_name},preview" >> $GITHUB_ENV
          else
            echo "DEPLOY_TYPE=none" >> $GITHUB_ENV
          fi

      - name: Build
        run: pnpm nx run-many -t build --prod

      - name: Configure AWS
        if: ${{ github.event_name == 'push' && env.DEPLOY_TYPE != 'none' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Lock for Deploy
        if: ${{ github.event_name == 'push' && env.DEPLOY_TYPE != 'none' }}
        uses: ahmadnassri/action-workflow-queue@v1

      - name: Deploy
        if: ${{ github.event_name == 'push' && env.DEPLOY_TYPE != 'none' }}
        run: pnpm nx run-many -t deploy --prod
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          NETLIFY_SITE_ID_STATIC: ${{ secrets.NETLIFY_SITE_ID_STATIC }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      - name: Build Desktop
        if: ${{ github.event_name == 'push' && env.DEPLOY_TYPE == 'stable' }}
        run: pnpm nx run @ootmm/desktop:build --prod

      - name: Upload Desktop to Release
        if: ${{ github.event_name == 'push' && env.DEPLOY_TYPE == 'stable' }}
        uses: softprops/action-gh-release@v2
        with:
          files: packages/desktop/dist/ootmm-*.zip
